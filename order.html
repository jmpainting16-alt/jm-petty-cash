<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>สั่งอาหาร</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f4f2;--card:#ffffff;--card2:#f1f0ec;--line:#e4e3dd;--ink:#141413;--ink2:#54534e;--muted:#8a8880;--accent:#eb6834;--accent2:#e34948;--green:#0ca30c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Sarabun",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#fff6f2,#ffffff);border-bottom:1px solid var(--line);padding:16px 18px}
.hd .shop{font-size:20px;font-weight:800}
.hd .tb{color:var(--accent);font-weight:700;font-size:14px;margin-top:2px}
.note{background:var(--card2);border-left:3px solid var(--accent);margin:12px 14px 0;padding:10px 14px;border-radius:8px;color:var(--ink2);font-size:14px}
.chips{position:sticky;top:70px;z-index:4;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--ink2);padding:7px 15px;border-radius:20px;font-size:14px;cursor:pointer;flex-shrink:0}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.list{padding:4px 14px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.itl{flex:1;min-width:0}
.nm{font-weight:600}
.pr{color:var(--accent);font-weight:700;margin-top:2px;font-size:15px}
.qty{display:flex;align-items:center;gap:10px;flex-shrink:0}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center;line-height:1}
.qty .add{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;width:auto;padding:0 16px;font-size:15px;height:34px}
.qty span{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cartbtn{position:fixed;left:14px;right:14px;bottom:16px;z-index:8;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 30px rgba(235,104,52,.4)}
.hide{display:none}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:flex-end;backdrop-filter:blur(2px)}
.sheet{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;border-top:1px solid var(--line)}
.sh-h{display:flex;align-items:center;font-size:18px;font-weight:800;margin-bottom:14px}
.sh-h .x{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rn{flex:1;min-width:0;font-weight:600}
.rp{color:var(--muted);font-weight:500;font-size:13px;margin-left:8px}
.rt{width:80px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.onote{width:100%;margin-top:14px;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px;font-family:inherit;font-size:15px;resize:vertical;min-height:60px}
.totrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:16px}
.totrow strong{font-size:24px;color:var(--accent)}
.send{width:100%;background:#06c755;color:#fff;border:none;border-radius:13px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;margin-bottom:10px}
.copy{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:15px;cursor:pointer}
.mt{color:var(--muted);text-align:center;padding:24px}
.mt2{color:var(--muted);text-align:center;font-size:13px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);padding:12px 20px;border-radius:12px;z-index:30;opacity:0;transition:.25s;font-size:14px;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;color:var(--muted);padding:60px 20px}
.kitchen{background:linear-gradient(135deg,var(--accent),var(--accent2))!important}
.success{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.success .ck{font-size:72px;animation:pop .4s}
.success h2{font-size:24px;margin:14px 0 6px}
.success p{color:var(--ink2);margin:0 0 26px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app"><div class="loading">กำลังโหลดเมนู…</div></div>
<div id="sheetWrap"></div>
<div class="toast" id="toast"></div>
<script>
/* ---- เมนูสำรอง (ใช้เมื่อโหลด menu.json ไม่ได้) ---- */
var DEFAULT={
  shop:"ร้านหม่าล่า นั่งชิล", line:"",
  note:"สแกนเพื่อดูเมนูและสั่งอาหาร เลือกของแล้วกดส่งออเดอร์ทาง LINE ได้เลย",
  items:[
    {n:"หม่าล่าไม้ (คละ)",c:"หม่าล่า",p:10},{n:"เซ็ตหม่าล่ารวม S",c:"หม่าล่า",p:199},
    {n:"เซ็ตหม่าล่ารวม M",c:"หม่าล่า",p:349},{n:"เซ็ตหม่าล่ารวม L",c:"หม่าล่า",p:599},
    {n:"หม้อหม่าล่าเดี่ยว",c:"หม่าล่า",p:129},{n:"เนื้อวัวสไลซ์ (จาน)",c:"อาหาร",p:89},
    {n:"หมูสไลซ์ (จาน)",c:"อาหาร",p:59},{n:"กุ้งสด (จาน)",c:"อาหาร",p:99},
    {n:"รวมมิตรผัก (จาน)",c:"อาหาร",p:49},{n:"ชุดกับแกล้ม",c:"อาหาร",p:159},{n:"ข้าวสวย",c:"อาหาร",p:15},
    {n:"เบียร์ช้าง (ขวด)",c:"เบียร์",p:90},{n:"เบียร์ลีโอ (ขวด)",c:"เบียร์",p:90},
    {n:"เบียร์สิงห์ (ขวด)",c:"เบียร์",p:100},{n:"เบียร์อาซาฮี (ขวด)",c:"เบียร์",p:130},
    {n:"ทาวเวอร์เบียร์",c:"เบียร์",p:490},{n:"เหล้าขาว (ขวด)",c:"เหล้า",p:250},
    {n:"แสงโสม (ขวด)",c:"เหล้า",p:550},{n:"รีเจนซี (ขวด)",c:"เหล้า",p:520},
    {n:"โซดา (ขวด)",c:"เครื่องดื่ม",p:30},{n:"โค้ก (ขวด)",c:"เครื่องดื่ม",p:40},{n:"น้ำแข็ง (ถัง)",c:"เครื่องดื่ม",p:30}
  ]
};
var CFG=DEFAULT, MENU=DEFAULT.items, cart={}, cats=[], activeCat="", table="", _odb=null, fbReady=false;

function money(n){return "฿"+(Math.round((+n||0)*100)/100).toLocaleString("th-TH");}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast on";setTimeout(function(){t.className="toast";},2200);}

function start(){
  table=(new URLSearchParams(location.search).get("table")||"").trim();
  MENU=CFG.items||[];
  cats=[];MENU.forEach(function(m){if(cats.indexOf(m.c)<0)cats.push(m.c);});
  activeCat=cats[0]||"";
  render();
}
function render(){
  var h="";
  h+='<div class="hd"><div class="shop">'+esc(CFG.shop||"สั่งอาหาร")+'</div>';
  h+='<div class="tb">'+(table?("โต๊ะ "+esc(table)):"สั่งกลับบ้าน / รับหน้าร้าน")+'</div></div>';
  if(CFG.note)h+='<div class="note">'+esc(CFG.note)+'</div>';
  h+='<div class="chips">';
  cats.forEach(function(c,ci){h+='<button class="chip'+(c===activeCat?" on":"")+'" onclick="setCat('+ci+')">'+esc(c)+'</button>';});
  h+='</div><div class="list">';
  MENU.forEach(function(m,i){ if(m.c!==activeCat)return;
    var q=cart[i]||0;
    h+='<div class="it"><div class="itl"><div class="nm">'+esc(m.n)+'</div><div class="pr">'+money(m.p)+'</div></div>';
    h+='<div class="qty">'+(q>0?('<button onclick="chg('+i+',-1)">−</button><span>'+q+'</span>'):"")+'<button class="add" onclick="chg('+i+',1)">'+(q>0?"+":"เพิ่ม")+'</button></div></div>';
  });
  h+='</div><div style="height:96px"></div>';
  var cnt=count();
  h+='<button class="cartbtn'+(cnt?"":" hide")+'" onclick="openSheet()">🛒 ดูออเดอร์ ('+cnt+') · '+money(total())+'</button>';
  document.getElementById("app").innerHTML=h;
}
function setCat(ci){activeCat=cats[ci];render();}
function count(){var n=0;for(var k in cart)n+=cart[k];return n;}
function total(){var t=0;for(var k in cart)t+=cart[k]*MENU[k].p;return t;}
function chg(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];render();if(document.querySelector(".sheetbg"))openSheet();}

function openSheet(){
  var h='<div class="sheetbg" onclick="bgClose(event)"><div class="sheet">';
  h+='<div class="sh-h">ออเดอร์ของคุณ'+(table?(" · โต๊ะ "+esc(table)):"")+'<button class="x" onclick="closeSheet()">✕</button></div>';
  var keys=Object.keys(cart);
  if(!keys.length){h+='<div class="mt">ยังไม่มีรายการ<br>แตะ “เพิ่ม” ที่เมนูก่อนนะ</div>';}
  else{
    keys.forEach(function(i){var m=MENU[i],q=cart[i];
      h+='<div class="row"><div class="rn">'+esc(m.n)+'<span class="rp">'+money(m.p)+'</span></div>';
      h+='<div class="qty"><button onclick="chg('+i+',-1)">−</button><span>'+q+'</span><button onclick="chg('+i+',1)">+</button></div>';
      h+='<div class="rt">'+money(m.p*q)+'</div></div>';
    });
    h+='<textarea id="onote" class="onote" placeholder="หมายเหตุถึงร้าน เช่น เผ็ดน้อย / เพิ่มน้ำจิ้ม / ไม่ใส่ผักชี">'+esc(window._note||"")+'</textarea>';
    h+='<div class="totrow"><span>รวมทั้งหมด</span><strong>'+money(total())+'</strong></div>';
    if(fbReady){
      h+='<button class="send kitchen" onclick="sendKitchen()">🍽️ ส่งออเดอร์เข้าครัว</button>';
      h+='<button class="copy" onclick="sendLine()">หรือส่งทาง LINE</button>';
      h+='<div class="mt2">กด “ส่งเข้าครัว” ออเดอร์จะถึงร้านทันที ทางร้านกำลังเตรียมให้</div>';
    }else{
      h+='<button class="send" onclick="sendLine()">📩 ส่งออเดอร์ทาง LINE</button>';
      h+='<button class="copy" onclick="copyOrder()">📋 คัดลอกออเดอร์ (เผื่อส่งเอง)</button>';
      h+='<div class="mt2">กด “ส่งทาง LINE” แล้วเลือกแชทของร้าน เพื่อยืนยันการสั่ง</div>';
    }
  }
  h+='</div></div>';
  document.getElementById("sheetWrap").innerHTML=h;
}
function bgClose(e){if(e.target.classList.contains("sheetbg"))closeSheet();}
function closeSheet(){var n=document.getElementById("onote");if(n)window._note=n.value;document.getElementById("sheetWrap").innerHTML="";}
function buildText(){
  var t="🍽️ ออเดอร์ใหม่"+(table?(" · โต๊ะ "+table):" · รับหน้าร้าน")+"\n"+(CFG.shop||"")+"\n----------\n";
  Object.keys(cart).forEach(function(i){var m=MENU[i],q=cart[i];t+="• "+m.n+" x"+q+" = "+money(m.p*q)+"\n";});
  t+="----------\nรวม: "+money(total())+"\n";
  var n=document.getElementById("onote");var note=n?n.value.trim():(window._note||"").trim();
  if(note)t+="หมายเหตุ: "+note+"\n";
  return t;
}
function sendLine(){
  if(!count()){toast("ยังไม่ได้เลือกรายการ");return;}
  var text=buildText();
  var url=CFG.line?("https://line.me/R/oaMessage/"+encodeURIComponent(CFG.line)+"/?"+encodeURIComponent(text)):("https://line.me/R/msg/text/?"+encodeURIComponent(text));
  location.href=url;
}
function copyOrder(){
  var text=buildText();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("คัดลอกออเดอร์แล้ว");},function(){toast("คัดลอกไม่สำเร็จ");});}
  else{toast("อุปกรณ์ไม่รองรับการคัดลอก");}
}

function initFB(){
  if(CFG.firebase&&window.firebase&&firebase.initializeApp){
    try{if(!firebase.apps.length)firebase.initializeApp(CFG.firebase);_odb=firebase.firestore();fbReady=true;}catch(e){fbReady=false;}
  }
}
function sendKitchen(){
  if(!count()){toast("ยังไม่ได้เลือกรายการ");return;}
  var items=Object.keys(cart).map(function(i){return {n:MENU[i].n,p:MENU[i].p,q:cart[i]};});
  var nn=document.getElementById("onote");var note=nn?nn.value.trim():((window._note||"").trim());
  var order={table:table||"",items:items,total:total(),note:note,status:"new",createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  var btn=document.querySelector(".send");if(btn){btn.textContent="กำลังส่ง...";btn.disabled=true;}
  _odb.collection("orders").add(order).then(function(){orderSuccess();}).catch(function(e){
    toast("ส่งไม่สำเร็จ: "+(e&&e.message||e));if(btn){btn.textContent="🍽️ ส่งออเดอร์เข้าครัว";btn.disabled=false;}
  });
}
function orderSuccess(){
  cart={};window._note="";
  document.getElementById("sheetWrap").innerHTML="";
  document.getElementById("app").innerHTML='<div class="success"><div class="ck">✅</div><h2>ส่งออเดอร์เข้าครัวแล้ว!</h2><p>'+(table?("โต๊ะ "+esc(table)+" · "):"")+'ทางร้านกำลังเตรียมให้ครับ 🙏</p><button class="send kitchen" style="max-width:280px" onclick="location.reload()">+ สั่งเพิ่ม</button></div>';
}

/* ---- โหลด menu.json (ถ้ามี) แล้วเริ่ม ---- */
fetch("menu.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
  if(d&&d.items&&d.items.length){CFG=d;}
}).catch(function(){}).finally(function(){initFB();start();});
</script>
</body>
</html>
